<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<title>Magnetico - Proton</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#build-timestamp {
	position: absolute;
	left: 1rem;
	right: 1rem;
	bottom: 4%;
	color: #d8e7ff;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: clamp(0.75rem, 2.5vw, 1rem);
	letter-spacing: 0.04em;
	text-align: center;
	text-shadow: 0 1px 4px #000;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<!-- Magnetica iPhone installed-PWA viewport fix -->
<meta
	name="viewport"
	content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<style>
	:root {
		--magnetica-visible-height: 100dvh;
	}

	html,
	body {
		margin: 0 !important;
		padding: 0 !important;
		width: 100% !important;
		height: var(--magnetica-visible-height) !important;
		min-height: var(--magnetica-visible-height) !important;
		overflow: hidden !important;
		background: #000 !important;
		overscroll-behavior: none;
		-webkit-text-size-adjust: 100%;
		touch-action: none;
	}

	body {
		position: fixed !important;
		inset: 0 !important;
	}

	#canvas {
		position: absolute !important;
		inset: 0 !important;
		display: block !important;
		width: 100% !important;
		height: 100% !important;
		margin: 0 !important;
		padding: 0 !important;
	}
</style>

<script>
	(function () {
		function updateMagneticaViewport() {
			const viewport = window.visualViewport;
			const visibleHeight = viewport
				? viewport.height
				: window.innerHeight;

			document.documentElement.style.setProperty(
				"--magnetica-visible-height",
				visibleHeight + "px"
			);

			document.body.style.height = visibleHeight + "px";

			window.scrollTo(0, 0);

			const canvas = document.getElementById("canvas");

			if (canvas) {
				canvas.style.width = "100%";
				canvas.style.height = "100%";
				canvas.style.top = "0";
				canvas.style.left = "0";
			}
		}

		window.addEventListener(
			"load",
			updateMagneticaViewport,
			{ passive: true }
		);

		window.addEventListener(
			"resize",
			updateMagneticaViewport,
			{ passive: true }
		);

		window.addEventListener(
			"orientationchange",
			function () {
				setTimeout(updateMagneticaViewport, 50);
				setTimeout(updateMagneticaViewport, 250);
				setTimeout(updateMagneticaViewport, 600);
			},
			{ passive: true }
		);

		if (window.visualViewport) {
			window.visualViewport.addEventListener(
				"resize",
				updateMagneticaViewport,
				{ passive: true }
			);

			window.visualViewport.addEventListener(
				"scroll",
				updateMagneticaViewport,
				{ passive: true }
			);
		}
	})();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="build-timestamp">Build: loading date and time…</div>
			<div id="status-notice"></div>
		</div>

		<script>
		(async function () {
			const label = document.getElementById('build-timestamp');

			try {
				const response = await fetch('index.pck', {
					method: 'HEAD',
					cache: 'no-store'
				});
				const modified = response.headers.get('Last-Modified');

				if (!modified) {
					throw new Error('No Last-Modified header');
				}

				label.textContent = 'Build: ' + new Date(modified).toLocaleString();
			} catch (error) {
				label.textContent = 'Build: date unavailable';
				console.warn('Could not read the web build timestamp.', error);
			}
		})();

		const cacheCleanupPromise = (async function () {
			try {
				if ("serviceWorker" in navigator) {
					const registrations =
						await navigator.serviceWorker.getRegistrations();

					for (const registration of registrations) {
						await registration.unregister();
					}
				}

				if ("caches" in window) {
					const cacheNames = await caches.keys();

					for (const cacheName of cacheNames) {
						await caches.delete(cacheName);
					}
				}

				console.log(
					"Magnetico latest: old service workers and caches cleared."
				);
			} catch (error) {
				console.warn(
					"Magnetico latest: cache cleanup failed.",
					error
				);
			}
		})();
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":37521268,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":null};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

		(async function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		await cacheCleanupPromise;
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
